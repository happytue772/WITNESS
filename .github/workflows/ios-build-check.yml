name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build-check.yml"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app WITNESS-iOS-unsigned.zip

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WITNESS-iOS-unsigned
          path: build/ios/iphoneos/WITNESS-iOS-unsigned.zip
          if-no-files-found: error
